appId: com.botmux.desktop
productName: Botmux
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
npmRebuild: false
extraMetadata:
  main: dist/desktop/main.cjs
asar: true
files:
  - dist/desktop/**
  - '!node_modules/**'
extraResources:
  - from: build/desktop-runtime
    to: runtime
  - from: build/desktop-node
    to: node
afterPack: build/after-pack.cjs
mac:
  icon: build/icon.png
  x64ArchFiles: 'Contents/Resources/{node/**,runtime/node_modules/.pnpm/**}'
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  sign: false
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
